SB_CONFIG_BM_BOOTLOADER_MCUBOOT_FIRMWARE_LOADER_ENTRANCE_BOOT_MODE=y
SB_CONFIG_BM_APP_CAN_SETUP_FIRMWARE_LOADER_NAME=y

# Firmware loader image decryption, the device private key goes to the end of the boot partition
SB_CONFIG_BM_FIRMWARE_LOADER_IMAGE_DECRYPTION=y
SB_CONFIG_BM_FIRMWARE_LOADER_ENC_KEY_FILE="enc-x25519-priv.pem"

# BOOTCONF write lock, not available for the nRF54LM20 in NCS BM v2.0.1
SB_CONFIG_BM_BOOT_BOOTCONF_LOCK_WRITES=y

# Nordic AP Protect
SB_CONFIG_APPROTECT_LOCK=y
SB_CONFIG_SECURE_APPROTECT_LOCK=y